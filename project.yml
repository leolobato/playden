name: BigScreen
options:
  bundleIdPrefix: com.gamenative
  deploymentTarget:
    macOS: '15.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    MACOSX_DEPLOYMENT_TARGET: '15.0'
packages:
  BigScreenKit:
    path: Packages/BigScreenKit
targets:
  BigScreen:
    type: application
    platform: macOS
    sources:
      - path: App
    postBuildScripts:
      - path: scripts/embed-runtime.sh
        name: Embed Steam runtime libraries
        basedOnDependencyAnalysis: false
        outputFiles:
          - '$(TARGET_BUILD_DIR)/$(FRAMEWORKS_FOLDER_PATH)/liblzma.5.dylib'
          - '$(TARGET_BUILD_DIR)/$(FRAMEWORKS_FOLDER_PATH)/libzstd.1.dylib'
          - '$(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/Licenses/liblzma.txt'
          - '$(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/Licenses/zstd.txt'
    dependencies:
      - package: BigScreenKit
        product: Domain
      - package: BigScreenKit
        product: Focus
      - package: BigScreenKit
        product: Input
      - package: BigScreenKit
        product: Catalog
      - package: BigScreenKit
        product: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gamenative.bigscreen
        PRODUCT_NAME: Big Screen
        PRODUCT_MODULE_NAME: BigScreen
        HEADER_SEARCH_PATHS: ['$(inherited)', /opt/homebrew/include]
        LIBRARY_SEARCH_PATHS: ['$(inherited)', /opt/homebrew/lib]
        LD_RUNPATH_SEARCH_PATHS: ['$(inherited)', '@executable_path/../Frameworks', '@loader_path/../Frameworks']
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Big Screen
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.games
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: '-'
        ENABLE_APP_SANDBOX: NO
  BigScreenTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests/AppTests]
    dependencies:
      - target: BigScreen
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: '-'
        TEST_HOST: '$(BUILT_PRODUCTS_DIR)/Big Screen.app/Contents/MacOS/Big Screen'
schemes:
  BigScreen:
    build:
      targets:
        BigScreen: all
    test:
      targets: [BigScreenTests]
