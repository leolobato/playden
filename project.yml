name: Playden
options:
  deploymentTarget:
    macOS: '15.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    MACOSX_DEPLOYMENT_TARGET: '15.0'
configFiles:
  Debug: Config/Build.xcconfig
  Release: Config/Build.xcconfig
packages:
  PlaydenKit:
    path: Packages/PlaydenKit
targets:
  Playden:
    type: application
    platform: macOS
    sources:
      - path: App
    postBuildScripts:
      - path: scripts/embed-display-helper.sh
        name: Build Windows display helper
        basedOnDependencyAnalysis: false
        outputFiles:
          - '$(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/PlaydenDisplay.exe'
      - path: scripts/embed-runtime.sh
        name: Embed Steam runtime libraries
        basedOnDependencyAnalysis: false
        outputFiles:
          - '$(TARGET_BUILD_DIR)/$(FRAMEWORKS_FOLDER_PATH)/liblzma.5.dylib'
          - '$(TARGET_BUILD_DIR)/$(FRAMEWORKS_FOLDER_PATH)/libzstd.1.dylib'
          - '$(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/Licenses/liblzma.txt'
          - '$(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/Licenses/zstd.txt'
    dependencies:
      - package: PlaydenKit
        product: Artwork
      - package: PlaydenKit
        product: Domain
      - package: PlaydenKit
        product: Focus
      - package: PlaydenKit
        product: Input
      - package: PlaydenKit
        product: Catalog
      - package: PlaydenKit
        product: Sources
      - package: PlaydenKit
        product: Runner
      - package: PlaydenKit
        product: Installs
      - package: PlaydenKit
        product: Sessions
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PLAYDEN_BUNDLE_IDENTIFIER)
        PRODUCT_NAME: Playden
        PRODUCT_MODULE_NAME: Playden
        MARKETING_VERSION: '0.1'
        CURRENT_PROJECT_VERSION: '1'
        HEADER_SEARCH_PATHS: ['$(inherited)', /opt/homebrew/include]
        LIBRARY_SEARCH_PATHS: ['$(inherited)', /opt/homebrew/lib]
        LD_RUNPATH_SEARCH_PATHS: ['$(inherited)', '@executable_path/../Frameworks', '@loader_path/../Frameworks']
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Playden
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.games
        INFOPLIST_KEY_NSRemovableVolumesUsageDescription: 'Playden installs and plays games on the drive you choose.'
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: '-'
        ENABLE_APP_SANDBOX: NO
  PlaydenTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests/AppTests]
    dependencies:
      - target: Playden
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PLAYDEN_BUNDLE_IDENTIFIER).tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: '-'
        TEST_HOST: '$(BUILT_PRODUCTS_DIR)/Playden.app/Contents/MacOS/Playden'
schemes:
  Playden:
    build:
      targets:
        Playden: all
    test:
      targets: [PlaydenTests]
